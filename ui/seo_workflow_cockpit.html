<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heartweb SEO Cockpit - Workflow & Prompt Auto-Loader</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #22c55e;
      --border: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); line-height: 1.5; display: flex; height: 100vh; overflow: hidden; }
    
    /* Sidebar Steps */
    .sidebar { width: 320px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
    .sidebar-header h2 { font-size: 16px; color: #fff; display: flex; align-items: center; gap: 8px; }
    .sidebar-header p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .step-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .step-btn { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 12px 16px; border-radius: 8px; text-align: left; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; gap: 4px; }
    .step-btn:hover { background: rgba(37, 99, 235, 0.15); border-color: var(--accent); }
    .step-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .step-btn .step-num { font-size: 11px; text-transform: uppercase; font-weight: bold; opacity: 0.8; }
    .step-btn .step-title { font-size: 13px; font-weight: 600; }
    
    /* Main Content Area */
    .main { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); overflow-y: auto; }
    .main-header { padding: 20px 30px; border-bottom: 1px solid var(--border); background: var(--bg-surface); display: flex; justify-content: space-between; align-items: center; }
    .main-header h1 { font-size: 20px; }
    .content-area { padding: 30px; display: flex; flex-direction: column; gap: 24px; max-width: 1100px; margin: 0 auto; width: 100%; }
    
    /* Form Inputs */
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .card h3 { font-size: 15px; margin-bottom: 16px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea { background: var(--bg-dark); border: 1px solid var(--border); color: #fff; padding: 10px 12px; border-radius: 6px; font-size: 13px; outline: none; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
    
    /* Prompt Preview & Copy */
    .prompt-box { position: relative; }
    .prompt-box textarea { width: 100%; height: 380px; background: #090d16; border: 1px solid var(--border); border-radius: 8px; color: #a5f3fc; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; padding: 16px; line-height: 1.5; resize: vertical; }
    .action-row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-success { background: var(--success); }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--success); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); display: none; z-index: 100; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>⚡ Heartweb SEO Cockpit</h2>
      <p>Prompt & Workflow Autoloader</p>
    </div>
    <div class="step-list" id="stepList">
      <!-- Steps injected by JS -->
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="main-header">
      <div>
        <h1 id="activeStepTitle">Schritt 0: Projekt-Kickoff</h1>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;" id="activeStepDesc">Generiert das zentrale Projekt-Manifest</p>
      </div>
      <div>
        <button class="btn btn-success" onclick="copyActivePrompt()">📋 Prompt in Zwischenablage kopieren</button>
      </div>
    </div>

    <div class="content-area">
      <!-- Global Client Context Card -->
      <div class="card">
        <h3>Mandanten- & Projektdaten (Autoload fuer alle Prompts)</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Kundenname / Projekt</label>
            <input type="text" id="cfg_client" value="simCura Pflegedienst Frankfurt" oninput="updatePrompt()">
          </div>
          <div class="form-group">
            <label>Projekt-ID (Slug)</label>
            <input type="text" id="cfg_slug" value="simcura-pflegedienst" oninput="updatePrompt()">
          </div>
          <div class="form-group">
            <label>Website-URL</label>
            <input type="text" id="cfg_url" value="https://simcura-pflege.de" oninput="updatePrompt()">
          </div>
          <div class="form-group">
            <label>Wettbewerber (Kommasepariert)</label>
            <input type="text" id="cfg_competitors" value="https://pflege-frankfurt-main.de, https://drk-frankfurt.de" oninput="updatePrompt()">
          </div>
          <div class="form-group">
            <label>Zielregionen</label>
            <input type="text" id="cfg_regions" value="Frankfurt am Main, Bornheim, Sachsenhausen, Nordend, Offenbach" oninput="updatePrompt()">
          </div>
          <div class="form-group">
            <label>Tonalitaet</label>
            <select id="cfg_tone" onchange="updatePrompt()">
              <option value="vertrauensbildend_ymyl">Vertrauensbildend (YMYL / Pflege / Recht)</option>
              <option value="professionell_warm">Professionell-warm (B2B / Handwerk)</option>
              <option value="verkaufsstark_direkt">Verkaufsstark / Direkt (DTC)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Aktuelles Thema (fuer Schritt 4a/4b)</label>
            <input type="text" id="cfg_topic" value="Pflegedienst Frankfurt Bornheim" oninput="updatePrompt()">
          </div>
        </div>
      </div>

      <!-- Generated Prompt Box -->
      <div class="card">
        <h3>Generierter XML-Prompt fuer Claude Desktop</h3>
        <div class="prompt-box">
          <textarea id="promptOutput" readonly></textarea>
        </div>
        <div class="action-row">
          <button class="btn" onclick="copyActivePrompt()">📋 In Claude Desktop einfuegen (Kopieren)</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">✅ Prompt erfolgreich in Zwischenablage kopiert!</div>

  <script>
    const STEPS = [
      { id: "0", name: "0-Kickoff", title: "Schritt 0: Projekt-Kickoff & Manifest", desc: "Initialisiert manifest.json mit allen Mandanten-Metadaten" },
      { id: "1", name: "1-Pillars", title: "Schritt 1: Pillar-Themen-Identifikation", desc: "Scannt Konkurrenz und strukturiert Haupt-Pillars" },
      { id: "1b", name: "1b-Architektur", title: "Schritt 1b: Seitenarchitektur & Menue", desc: "Plant Navigation und baut interaktives HTML-Diagramm" },
      { id: "1c", name: "1c-Templates", title: "Schritt 1c: Pillar-Templates & Design", desc: "Extrahiert CSS-Tokens aus Screenshot und baut Pillar-HTML" },
      { id: "2", name: "2-Keywords", title: "Schritt 2: AgentSEO Keyword-Maschine", desc: "Zieht vollautomatisch Suchvolumen & KD via AgentSEO API" },
      { id: "3", name: "3-120-Tage-Plan", title: "Schritt 3: 120-Tage-Roadmap & Solver", desc: "Berechnet 17 Wochen a 10-15h + Verlinkungs-Map" },
      { id: "3b", name: "3b-Performance", title: "Schritt 3b: Performance-Check & Sync", desc: "Adaptive Phasenanpassung nach Tag 30/60/90" },
      { id: "4a", name: "4a-Briefing", title: "Schritt 4a: Content-Briefing & Schema", desc: "SERP-Check, Notion-Frontmatter fuer Texter & JSON-LD" },
      { id: "4b", name: "4b-Landingpage", title: "Schritt 4b: Landingpage HTML-Generator", desc: "Erzeugt autarke Landingpages fuer Web-Entwickler" }
    ];

    let currentStepIndex = 0;

    function renderSidebar() {
      const list = document.getElementById("stepList");
      list.innerHTML = STEPS.map((s, idx) => `
        <button class="step-btn ${idx === currentStepIndex ? 'active' : ''}" onclick="selectStep(${idx})">
          <span class="step-num">Schritt ${s.name}</span>
          <span class="step-title">${s.title}</span>
        </button>
      `).join("");
    }

    function selectStep(idx) {
      currentStepIndex = idx;
      renderSidebar();
      const step = STEPS[idx];
      document.getElementById("activeStepTitle").innerText = step.title;
      document.getElementById("activeStepDesc").innerText = step.desc;
      updatePrompt();
    }

    function updatePrompt() {
      const client = document.getElementById("cfg_client").value;
      const slug = document.getElementById("cfg_slug").value;
      const url = document.getElementById("cfg_url").value;
      const comps = document.getElementById("cfg_competitors").value;
      const regions = document.getElementById("cfg_regions").value;
      const tone = document.getElementById("cfg_tone").value;
      const topic = document.getElementById("cfg_topic").value;

      const step = STEPS[currentStepIndex];
      let pText = "";

      if (step.id === "0") {
        pText = `<system_role>
Du bist Senior SEO Content Architect fuer Heartweb.
Initialisiere die Datei manifest.json fuer das Kundenprojekt.
</system_role>

<input_briefing>
Projekt/Kunde: ${client}
Projekt-ID: ${slug}
Website-URL: ${url}
Top-Wettbewerber: ${comps}
Zielregionen: ${regions}
Tonalitaet: ${tone}
Wochenkapazitaet: 10.0 bis 15.0 Std/Woche
</input_briefing>

<instructions>
Erstelle die Datei manifest.json validiert gegen standards/manifest.schema.json.
</instructions>`;
      } else if (step.id === "1") {
        pText = `<system_role>
Du bist Senior SEO Content Stratege.
Analysiere die Website ${url} und die Wettbewerber (${comps}) und strukturiere die Core Pillars.
Speichere das Ergebnis als outputs/1-pillar-themen.md.
</system_role>`;
      } else if (step.id === "2") {
        pText = `<system_role>
Du bist Senior Keyword Researcher.
Recherchiere 25 bis 40 Cluster-Ideen pro Pillar fuer ${client}.
Rufe das Tool agentseo_keyword_metrics_overview auf fuer automatische Suchvolumen- und KD-Werte.
Speichere die Daten als outputs/2-cluster-themen-agentseo.csv.
</system_role>`;
      } else if (step.id === "3") {
        pText = `<system_role>
Du bist Senior Content Operations Lead.
Erstelle den 120-Tage-Plan (17 Wochen a 10-15h) aus outputs/2-cluster-themen-agentseo.csv.
Verwende die mathematische Logik aus mcp/tools/capacity_matrix_solver.py.
Speichere den Plan unter outputs/3-plan.md.
</system_role>`;
      } else if (step.id === "4a") {
        pText = `<system_role>
Du bist Lead Conversion-Copywriter.
Erstelle das redaktionsfertige Briefing fuer das Thema: "${topic}".
1. Live-SERP-Check via AgentSEO MCP.
2. Section-fuer-Section Gliederung mit EEAT.
3. Schema.org JSON-LD Codeblock.
4. YAML-Frontmatter fuer den Notion-Import.
Speichere unter outputs/briefings/briefing-${slug}-${topic.toLowerCase().replace(/\\s+/g, '-')}.md.
</system_role>`;
      } else if (step.id === "4b") {
        pText = `<system_role>
Du bist Senior Frontend Developer.
Baue die autarke HTML-Landingpage fuer das Thema: "${topic}".
Nutze verbindlich die CSS-Tokens aus standards/design-system.css.
Speichere unter outputs/html/landingpage-${slug}-${topic.toLowerCase().replace(/\\s+/g, '-')}.html.
</system_role>`;
      } else {
        pText = `XML-Prompt fuer Schritt ${step.name} (${step.title}) mit aktuellem Mandanten-Kontext (${client}).`;
      }

      document.getElementById("promptOutput").value = pText;
    }

    function copyActivePrompt() {
      const txt = document.getElementById("promptOutput").value;
      navigator.clipboard.writeText(txt).then(() => {
        const toast = document.getElementById("toast");
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 2500);
      });
    }

    // Init
    renderSidebar();
    updatePrompt();
  </script>
</body>
</html>
